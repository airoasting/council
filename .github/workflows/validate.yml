name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 에이전트 25인과 문서 정합성
        run: python3 scripts/validate_agents.py

      - name: 사이트가 agents/ 와 맞는지
        run: python3 scripts/build_docs.py --check

      - name: README 표가 사이트와 맞는지
        run: python3 scripts/sync_docs.py --check

      - name: install.sh 문법
        run: bash -n install.sh
