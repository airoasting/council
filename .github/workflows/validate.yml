name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 에이전트 25인과 문서 정합성
        run: python3 scripts/validate_agents.py

      - name: 사이트가 agents/ 와 맞는지
        run: python3 scripts/build_docs.py --check

      - name: README 표가 사이트와 맞는지
        run: python3 scripts/sync_docs.py --check

      - name: install.sh 문법
        run: bash -n install.sh

      - name: 파이썬 스크립트 문법
        run: python3 -m py_compile scripts/*.py

      - name: 채점기 자체 시험
        run: python3 scripts/check_run.py --self-test

      # 실행 기록 채점(check_run.py <기록>)은 넣지 않는다. 채점 대상인 실행 기록을 사람이 만들기 때문이다.
      # 릴리스 전 실행 경로와 채점은 tests/CASES.md 를 따른다.
